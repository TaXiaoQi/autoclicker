pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "Autoclicker"

def versionsDir = file("versions")
if (versionsDir.exists() && versionsDir.isDirectory()) {
    versionsDir.eachDir { dir ->
        include dir.name
        project(":${dir.name}").projectDir = dir
    }
}