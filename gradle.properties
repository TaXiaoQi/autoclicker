org.gradle.jvmargs=-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -Djdk.pollerMode=1
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache-problems=warn
org.gradle.workers.jvmargs=-Djdk.pollerMode=1
# 如需固定守护进程 JDK 21（26.x 编译通过 fork + toolchain 使用 JDK 25），请改在命令行
# -Dorg.gradle.java.home=... 或用户级 ~/.gradle/gradle.properties 中配置，
# 不要在本文件硬编码本机绝对路径，否则其他机器/CI 构建会直接失败。