plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT' apply false
}

// 读取版本属性文件
def loadVersionProperties() {
    def versionFile = file('gradle/version.properties')
    def properties = new Properties()
    if (versionFile.exists()) {
        versionFile.withInputStream { properties.load(it) }
    }
    return properties
}

def versionProps = loadVersionProperties()
def modVersion = versionProps.getProperty('modVersion', '1.0.0')

