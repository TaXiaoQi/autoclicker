    project(':1.21.6').tasks.named('build').configure {
        mustRunAfter ':1.21.5:build'
    }
    dependsOn ':1.21.6:build'

    project(':1.21.7').tasks.named('build').configure {
        mustRunAfter ':1.21.6:build'
    }
    dependsOn ':1.21.7:build'

    project(':1.21.8').tasks.named('build').configure {
        mustRunAfter ':1.21.7:build'
    }
    dependsOn ':1.21.8:build'

    project(':1.21.9').tasks.named('build').configure {
        mustRunAfter ':1.21.8:build'
    }
    dependsOn ':1.21.9:build'

    project(':1.21.10').tasks.named('build').configure {
        mustRunAfter ':1.21.9:build'
    }
    dependsOn ':1.21.10:build'

    project(':1.21.11').tasks.named('build').configure {
        mustRunAfter ':1.21.10:build'
    }
    dependsOn ':1.21.11:build'

    // 最后是 26.1 系列
    project(':26.1').tasks.named('build').configure {
        mustRunAfter ':1.21.11:build'
    }
    dependsOn ':26.1:build'

    project(':26.1.1').tasks.named('build').configure {
        mustRunAfter ':26.1:build'
