plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT' apply false
}

// ✅ 定义每个 MC 版本对应的Fabric api
def fabricApiVersions = [
        "1.21.1": "0.116.7+1.21.1",
        "1.21.2": "0.106.1+1.21.2",
        "1.21.3": "0.114.1+1.21.3",
        "1.21.4": "0.119.4+1.21.4",
        "1.21.5": "0.128.2+1.21.5",
        "1.21.6": "0.128.2+1.21.6",
        "1.21.7": "0.129.0+1.21.7",
        "1.21.8": "0.136.1+1.21.8",
        "1.21.9": "0.134.1+1.21.9",
        "1.21.10": "0.138.4+1.21.10",
        "1.21.11": "0.140.2+1.21.11"
]

def modMenuVersions = "7.2.2"

subprojects {
    apply plugin: 'java'
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    def mcVersion = project.name

    if (!fabricApiVersions.containsKey(mcVersion)) {
        throw new GradleException("Unsupported Minecraft version: ${mcVersion}. Add it to fabricApiVersions.")
    }

    version = "1.4.0"  // 模组版本
    group = "com.example.autoclicker"

    // ✅ 预先定义用于资源处理的变量
    def fullVersion = "${version}+${mcVersion}"

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mcVersion}"
        mappings loom.layered() { officialMojangMappings() }
        modImplementation "net.fabricmc:fabric-loader:0.18.0"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersions[mcVersion]}"
        modImplementation "com.terraformersmc:modmenu:7.2.2"
        // modImplementation "com.terraformersmc:modmenu:${modMenuVersions[mcVersion]}"
    }

    // ✅ 正确的 sourceSets 配置
    sourceSets.main {
        java.srcDirs = [
                file("$rootDir/src/version-specific/${mcVersion}/java"),
                file("$rootDir/src/main/java")
        ]
        resources.srcDirs = [
                file("$rootDir/src/version-specific/${mcVersion}/resources"),
                file("$rootDir/src/main/resources")
        ]
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    processResources {
        filesMatching("fabric.mod.json") {
            expand([
                    "version": fullVersion,
                    "minecraft_version": mcVersion,
                    "java_version": 21
            ])
        }
    }

    tasks.named('remapJar') {
        archiveBaseName = "Autoclicker"  // 输出的文件名称
        archiveVersion = "${project.version}+${mcVersion}" // 带版本
    }

    tasks.register('copyBuild', Copy) {
        dependsOn tasks.named('remapJar')
        from(tasks.named('remapJar').map { it.archiveFile })
        into(layout.projectDirectory.dir("$rootDir/dist"))
    }

    tasks.named('build') {
        finalizedBy tasks.named('copyBuild')
    }
}

// 一键构建所有版本
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Build all supported Minecraft versions'
    dependsOn subprojects.collect { ":${it.name}:build" }
}

tasks.register('cleanAll') {
    group = 'build'
    description = 'Clean all versions'
    dependsOn subprojects*.tasks*.clean
}