// 版本分组映射（返回源码目录列表，按顺序叠加；同名类不允许跨目录重复）
def getVersionGroups = { mcVersion ->
    if (mcVersion == "1.16.5") {
        // 1.16.5：Widget 基类 + addButton，独立完整 era 目录
        return ["1.16.5"]
    }
    if (mcVersion ==~ /1\.17(?:\.[01])?/ || mcVersion ==~ /1\.18(?:\.[12])?/) {
        // 1.17~1.18.2：AbstractWidget 体系 + 四参 useItemOn（含 level）
        return ["1.17.1-1.18.2"]
    }
    if (mcVersion ==~ /1\.19(?:\.[12])?/) {
        // 1.19~1.19.2：三参 useItemOn，但尚无 Component 静态工厂
        return ["1.19-1.19.2"]
    }
    if (mcVersion == "1.19.3") {
        // 1.19.3：无 StringWidget/renderWidget（1.19.4 引入），独立 era
        return ["1.19.3"]
    }
    if (mcVersion == "1.19.4") {
        // 1.19.4：StringWidget/Button.builder/renderWidget 已引入，尚无 GuiGraphics
        return ["1.19.4"]
    }
    if (mcVersion == "1.20" || mcVersion == "1.20.1") {
        return ["shared-1.20", "1.20-1.20.1"]
    }
    if (mcVersion ==~ /1\.20(?:\.[2-6])?/ || mcVersion ==~ /1\.21(?:\.[1-4])?/) {
        return ["shared-1.20", "1.20.2-1.21.4"]
    }
    if (mcVersion ==~ /1\.21\.[5-8]/) {
        return ["shared-1.20", "1.21.5-1.21.8"]
    }
    if (mcVersion ==~ /1\.21\.9/) {
        return ["shared-1.20", "1.21.9"]
    }
    if (mcVersion ==~ /1\.21\.10/) {
        return ["shared-1.20", "1.21.10"]
    }
    if (mcVersion ==~ /1\.21\.11/) {
        return ["shared-1.20", "1.21.11"]
    }
    if (mcVersion ==~ /26\.1(?:\.[1-9])?/) {
        return ["shared-1.20", "26.1"]
    }
    if (mcVersion ==~ /26\.2(?:\.[1-9])?/) {
        // 26.2 起 screen/消息 API 变更，独立完整 era 目录
        return ["shared-1.20", "26.2"]
    }
    if (mcVersion ==~ /26\.3(?:\.[1-9])?/) {
        return ["shared-1.20", "26.3"]
    }
    throw new GradleException("Unknown version: ${mcVersion}")
}

// 根据 Minecraft 版本返回对应的 Java 版本
def getJavaVersionForMc = { mcVersion ->
    if (mcVersion.startsWith('1.20')) return 21
    if (mcVersion.startsWith('1.21')) return 21
    if (mcVersion.startsWith('26')) return 25
    return 21 // 默认
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    // 从根项目继承模组版本
    project.version = modVersion
    project.group = "com.example.autoclicker"

    def mcVersion = project.name
    def isModern = mcVersion.startsWith('26')

    // 根据版本应用不同的 Loom 插件
    if (isModern) {
        apply plugin: 'net.fabricmc.fabric-loom'
    } else {
        apply plugin: 'net.fabricmc.fabric-loom-remap'
    }

    // 定义用于资源处理的变量
    def fullVersion = "${modVersion}+${mcVersion}"

    // 获取版本组
    def versionGroups = getVersionGroups(mcVersion)

    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        // 添加 Mod Menu 的官方 Maven 仓库
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases"
        }
        // 如果 alpha 版本在快照仓库，也可能需要这个
        maven {
            name = "TerraformersMC Snapshots"
            url = "https://maven.terraformersmc.com/snapshots"
        }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mcVersion}"

        if (!isModern) {
            mappings loom.officialMojangMappings()
        }

        def modMenuVersion = modMenuVersions[mcVersion]

        // 1.20 之前的老版本使用旧 loader，避免 0.18.x 的新字节码影响 --release 降级编译
        def loaderVersion = (mcVersion.startsWith('1.16') || mcVersion.startsWith('1.17')
                || mcVersion.startsWith('1.18') || mcVersion.startsWith('1.19'))
                ? "0.16.14" : "0.18.4"

        if (isModern) {
            implementation "net.fabricmc:fabric-loader:${loaderVersion}"
            implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersions[mcVersion]}"
            implementation "com.terraformersmc:modmenu:${modMenuVersion}"
        } else {
            modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersions[mcVersion]}"
            modImplementation "com.terraformersmc:modmenu:${modMenuVersion}"
        }
    }

    // 配置java
    def javaVersion = getJavaVersionForMc(mcVersion)
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'

        // 26.1 系列（JDK 25）使用 fork 模式，隔离编译进程
        if (mcVersion.startsWith('26')) {
            options.fork = true
            def jdkPath = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(25)
            }.get().executablePath.asFile.absolutePath.replace('\\', '/')
            options.forkOptions.javaHome = file(jdkPath).parentFile.parentFile
        }

        // 旧版本用 toolchain 21 编译但按历史字节码级别降级（--release）
        if (mcVersion == "1.16.5") {
            options.release = 8
        } else if (mcVersion == "1.17" || mcVersion == "1.17.1") {
            options.release = 16
        } else if (mcVersion.startsWith("1.18") || mcVersion.startsWith("1.19")) {
            options.release = 17
        }
    }

    // 使用版本组
    sourceSets.main {
        java.srcDirs = versionGroups.collect { file("$rootDir/src/version-specific/${it}/java") } +
                [file("$rootDir/src/main/java")]
        resources.srcDirs = [
                // 只包含主项目的资源目录
                file("$rootDir/src/main/resources")
        ]

        // 显式设置输出目录
        output.resourcesDir = layout.buildDirectory.dir("classes/java/main").get().asFile
    }

    // 添加文件监视，当 version.properties 变化时重新处理资源
    def versionPropertiesFile = file("$rootDir/gradle/version.properties")

    processResources {
        // 监控版本属性文件的变化
        inputs.file(versionPropertiesFile).withPropertyName("versionProperties")

        inputs.property "version", fullVersion
        inputs.property "minecraft_version", mcVersion
        inputs.property "java_version", getJavaVersionForMc(mcVersion)

        filesMatching("fabric.mod.json") {
            expand([
                    "version": fullVersion,
                    "minecraft_version": mcVersion,
                    "java_version": getJavaVersionForMc(mcVersion)
            ])
        }
    }

    // 根据版本选择不同的打包任务
    if (isModern) {
        tasks.named('jar') {
            archiveBaseName = "Autoclicker"
            archiveVersion = "${modVersion}+${mcVersion}"
        }
        def outputDir = rootProject.layout.projectDirectory.dir("dist")
        def outputFileName = "Autoclicker-${modVersion}+${mcVersion}.jar"
        tasks.register('copyBuild', Copy) {
            description = "Copy JAR to root dist directory"
            group = "build"
            dependsOn tasks.named('jar')
            from(tasks.named('jar').map { it.archiveFile })
            into(outputDir)
            rename { outputFileName }
        }
    } else {
        // 对于旧版本，可以继续使用 remapJar
        tasks.named('remapJar') {
            archiveBaseName = "Autoclicker"
            archiveVersion = "${modVersion}+${mcVersion}"
        }
        def outputDir = rootProject.layout.projectDirectory.dir("dist")
        def outputFileName = "Autoclicker-${modVersion}+${mcVersion}.jar"
        tasks.register('copyBuild', Copy) {
            description = "Copy remapped JAR to root dist directory"
            group = "build"
            dependsOn tasks.named('remapJar')
            from(tasks.named('remapJar').map { it.archiveFile })
            into(outputDir)
            rename { outputFileName }
        }
    }

    tasks.named('build') {
        finalizedBy tasks.named('copyBuild')
    }

    // 添加一个只更新版本的任务
    tasks.register('updateVersionResources') {
        group = 'build'
        description = 'Only update resources when version changes'

        dependsOn processResources

        doFirst {
            println "更新版本到: ${fullVersion}"
        }
    }
}

// 一键构建所有版本（顺序执行，避免内存问题）
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Build all supported Minecraft versions sequentially'

    // 从 1.16.5 开始，到 26.x 系列结束
    def versionOrder = [
            '1.16.5',
            '1.17', '1.17.1', '1.18', '1.18.1', '1.18.2',
            '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
            '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
            '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4',
            '1.21.5', '1.21.6', '1.21.7', '1.21.8',
            '1.21.9', '1.21.10', '1.21.11',
            '26.1', '26.1.1', '26.1.2', '26.2', '26.3'
    ]

    versionOrder.each { v -> dependsOn ":${v}:build" }

    // 依次串联顺序：每个版本的 build 在前一个版本之后执行
    for (int i = 1; i < versionOrder.size(); i++) {
        def prev = versionOrder[i - 1]
        project(":${versionOrder[i]}").tasks.named('build').configure {
            mustRunAfter ":${prev}:build"
        }
    }
}