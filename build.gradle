plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT' apply false
}

// 读取版本属性文件
def loadVersionProperties() {
    def versionFile = file('gradle/version.properties')
    def properties = new Properties()
    if (versionFile.exists()) {
        versionFile.withInputStream { properties.load(it) }
    }
    return properties
}

def versionProps = loadVersionProperties()
def modVersion = versionProps.getProperty('modVersion', '1.0.0')

println "使用模组版本: ${modVersion}"

// MC 版本对应的Fabric api
def fabricApiVersions = [
        "1.21.1": "0.116.7+1.21.1",
        "1.21.2": "0.106.1+1.21.2",
        "1.21.3": "0.114.1+1.21.3",
        "1.21.4": "0.119.4+1.21.4",
        "1.21.5": "0.128.2+1.21.5",
        "1.21.6": "0.128.2+1.21.6",
        "1.21.7": "0.129.0+1.21.7",
        "1.21.8": "0.136.1+1.21.8",
        "1.21.9": "0.134.1+1.21.9",
        "1.21.10": "0.138.4+1.21.10",
        "1.21.11": "0.140.2+1.21.11"
]

// 版本分组映射
def getVersionGroup = { mcVersion ->
    switch (mcVersion) {
        case "1.21.11":
            return "1.21.11"
        case "1.21.10":
            return "1.21.10"
        case "1.21.9":
            return "1.21.9"
        case ~/1\.21\.[1-4]/:
            return "1.21.1-1.21.4"
        case ~/1\.21\.[5-8]/:
            return "1.21.5-1.21.8"
        default:
            throw new GradleException("Unknown version: ${mcVersion}")
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    // 从根项目继承模组版本
    project.version = modVersion
    project.group = "com.example.autoclicker"

    def mcVersion = project.name

    if (!fabricApiVersions.containsKey(mcVersion)) {
        throw new GradleException("Unsupported Minecraft version: ${mcVersion}. Add it to fabricApiVersions.")
    }

    // 定义用于资源处理的变量
    def fullVersion = "${modVersion}+${mcVersion}"

    // 获取版本组
    def versionGroup = getVersionGroup(mcVersion)

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mcVersion}"
        mappings loom.layered() { officialMojangMappings() }
        modImplementation "net.fabricmc:fabric-loader:0.18.0"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersions[mcVersion]}"
        modImplementation "com.terraformersmc:modmenu:7.2.2"
    }

    // 使用版本组
    sourceSets.main {
        java.srcDirs = [
                file("$rootDir/src/version-specific/${versionGroup}/java"),
                file("$rootDir/src/main/java")
        ]
        resources.srcDirs = [
                // 只包含主项目的资源目录
                file("$rootDir/src/main/resources")
        ]

        // 显式设置输出目录
        output.resourcesDir = layout.buildDirectory.dir("classes/java/main").get().asFile
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    // 添加文件监视，当 version.properties 变化时重新处理资源
    def versionPropertiesFile = file("$rootDir/gradle/version.properties")

    processResources {
        // 监控版本属性文件的变化
        inputs.file(versionPropertiesFile).withPropertyName("versionProperties")

        inputs.property "version", fullVersion
        inputs.property "minecraft_version", mcVersion
        inputs.property "java_version", 21

        // 添加构建时间戳，确保每次构建都不同（可选）
        inputs.property "build_timestamp", System.currentTimeMillis()

        filesMatching("fabric.mod.json") {
            expand([
                    "version": fullVersion,
                    "minecraft_version": mcVersion,
                    "java_version": 21
            ])
        }
    }

    tasks.named('remapJar') {
        archiveBaseName = "Autoclicker"
        archiveVersion = "${modVersion}+${mcVersion}"
    }

    def outputDir = rootProject.layout.projectDirectory.dir("dist")
    def outputFileName = "Autoclicker-${modVersion}+${mcVersion}.jar"

    tasks.register('copyBuild', Copy) {
        description = "Copy remapped JAR to root dist directory"
        group = "build"

        dependsOn tasks.named('remapJar')
        from(tasks.named('remapJar').map { it.archiveFile })
        into(outputDir)
        rename { outputFileName }
    }

    tasks.named('build') {
        finalizedBy tasks.named('copyBuild')
    }

    // 添加一个只更新版本的任务
    tasks.register('updateVersionResources') {
        group = 'build'
        description = 'Only update resources when version changes'

        dependsOn processResources

        doFirst {
            println "更新版本到: ${fullVersion}"
        }
    }
}

// 一键构建所有版本（顺序执行，避免内存问题）
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Build all supported Minecraft versions sequentially'

    // 使用 dependsOn 链
    dependsOn ':1.21.1:build'

    // 手动配置链式依赖
    project(':1.21.2').tasks.named('build').configure {
        mustRunAfter ':1.21.1:build'
    }
    dependsOn ':1.21.2:build'

    project(':1.21.3').tasks.named('build').configure {
        mustRunAfter ':1.21.2:build'
    }
    dependsOn ':1.21.3:build'

    project(':1.21.4').tasks.named('build').configure {
        mustRunAfter ':1.21.3:build'
    }
    dependsOn ':1.21.4:build'

    project(':1.21.5').tasks.named('build').configure {
        mustRunAfter ':1.21.4:build'
    }
    dependsOn ':1.21.5:build'

    project(':1.21.6').tasks.named('build').configure {
        mustRunAfter ':1.21.5:build'
    }
    dependsOn ':1.21.6:build'

    project(':1.21.7').tasks.named('build').configure {
        mustRunAfter ':1.21.6:build'
    }
    dependsOn ':1.21.7:build'

    project(':1.21.8').tasks.named('build').configure {
        mustRunAfter ':1.21.7:build'
    }
    dependsOn ':1.21.8:build'

    project(':1.21.9').tasks.named('build').configure {
        mustRunAfter ':1.21.8:build'
    }
    dependsOn ':1.21.9:build'

    project(':1.21.10').tasks.named('build').configure {
        mustRunAfter ':1.21.9:build'
    }
    dependsOn ':1.21.10:build'

    project(':1.21.11').tasks.named('build').configure {
        mustRunAfter ':1.21.10:build'
    }
    dependsOn ':1.21.11:build'
}

// 构建文件输出至指定文件夹
tasks.register('cleanAll') {
    group = 'build'
    description = 'Clean all versions'
    dependsOn subprojects*.tasks*.clean

    doLast {
        delete "$rootDir/dist"  // 目的文件夹
    }
}

// 添加一个只更新所有版本资源文件的任务
tasks.register('updateAllVersions') {
    group = 'build'
    description = 'Update version resources for all versions'

    dependsOn ':1.21.1:updateVersionResources'

    project(':1.21.2').tasks.named('updateVersionResources').configure {
        mustRunAfter ':1.21.1:updateVersionResources'
    }
    dependsOn ':1.21.2:updateVersionResources'

    // ... 为其他所有版本添加类似的依赖链 ...
}