plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

rootProject.name = "autoclicker-multi"

def versionsDir = file("versions")
if (versionsDir.exists() && versionsDir.isDirectory()) {
    versionsDir.eachDir { dir ->
        include dir.name
        project(":${dir.name}").projectDir = dir
    }
}

plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT' apply false
}

// MC 版本对应的Fabric api
def fabricApiVersions = [
        "1.21.1": "0.116.7+1.21.1",
        "1.21.2": "0.106.1+1.21.2",
        "1.21.3": "0.114.1+1.21.3",
        "1.21.4": "0.119.4+1.21.4",
        "1.21.5": "0.128.2+1.21.5",
        "1.21.6": "0.128.2+1.21.6",
        "1.21.7": "0.129.0+1.21.7",
        "1.21.8": "0.136.1+1.21.8",
        "1.21.9": "0.134.1+1.21.9",
        "1.21.10": "0.138.4+1.21.10",
        "1.21.11": "0.140.2+1.21.11"
]

// def modMenuVersions = "7.2.2"

// 版本分组
def getVersionGroup = { mcVersion ->
    if (mcVersion == "1.21.11") {
        return "1.21.11"
    } else if (mcVersion == "1.21.9") {
        return "1.21.9"
    } else if (mcVersion == "1.21.10") {
        return "1.21.10"
    } else if (mcVersion.startsWith("1.21.")) {
        return "1.21.1-1.21.8"
    }
    return mcVersion
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    def mcVersion = project.name

    if (!fabricApiVersions.containsKey(mcVersion)) {
        throw new GradleException("Unsupported Minecraft version: ${mcVersion}. Add it to fabricApiVersions.")
    }

    version = "1.4.0"  // 模组版本
    group = "com.example.autoclicker"

    // 定义用于资源处理的变量
    def fullVersion = "${version}+${mcVersion}"

    // 获取版本组
    def versionGroup = getVersionGroup(mcVersion)

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mcVersion}"
        mappings loom.layered() { officialMojangMappings() }
        modImplementation "net.fabricmc:fabric-loader:0.18.0"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersions[mcVersion]}"
        modImplementation "com.terraformersmc:modmenu:7.2.2"
    }

    // 使用版本组
    sourceSets.main {
        java.srcDirs = [
                file("$rootDir/src/version-specific/${versionGroup}/java"),
                file("$rootDir/src/main/java")
        ]
        resources.srcDirs = [
                file("$rootDir/src/version-specific/${versionGroup}/resources"),
                file("$rootDir/src/main/resources")
        ]
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    processResources {
        filesMatching("fabric.mod.json") {
            expand([
                    "version": fullVersion,
                    "minecraft_version": mcVersion,
                    "java_version": 21
            ])
        }
    }

    tasks.named('remapJar') {
        archiveBaseName = "Autoclicker"
        archiveVersion = "${project.version}+${mcVersion}"
    }

    tasks.register('copyBuild', Copy) {
        dependsOn tasks.named('remapJar')
        from(tasks.named('remapJar').map { it.archiveFile })
        into("$rootDir/dist")

        rename { fileName ->
            "Autoclicker-${mcVersion}.jar"
        }
    }

    tasks.named('build') {
        finalizedBy tasks.named('copyBuild')
    }
}

// 一键构建所有版本（顺序执行，避免内存问题）
tasks.register('buildAllVersions') {
    group = 'build'
    description = 'Build all supported Minecraft versions sequentially'

    // 定义构建顺序
    def buildOrder = [
            ':1.21.1:build',
            ':1.21.2:build',
            ':1.21.3:build',
            ':1.21.4:build',
            ':1.21.5:build',
            ':1.21.6:build',
            ':1.21.7:build',
            ':1.21.8:build',
            ':1.21.9:build',
            ':1.21.10:build',
            ':1.21.11:build'
    ]

    // 创建任务依赖链，确保顺序执行
    buildOrder.eachWithIndex { taskPath, index ->
        if (index > 0) {
            tasks.findByPath(taskPath)?.mustRunAfter(buildOrder[index - 1])
        }
        dependsOn taskPath
    }
}

tasks.register('cleanAll') {
    group = 'build'
    description = 'Clean all versions'
    dependsOn subprojects*.tasks*.clean

    doLast {
        delete "$rootDir/dist"
    }
}